<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoPet Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root {
  /* EcoPet Learn: burgundy brand, green = healthy, yellow = warning. The pet's "screen" is the hero of every page. */
  --burgundy: #6B1728;
  --burgundy-soft: #F6E8EB;
  --forest: #138A63;
  --green: #22A06B;
  --green-soft: #E5F4EC;
  --yellow: #F5A623;
  --yellow-soft: #FEF3DF;
  --bg: #F7F8FA;
  --grey: #E8EDF2;
  --navy: #14243B;
  --muted: #5A6A80;
  --card: #FFFFFF;
  --line: #E1E7EE;
  --water: #3B9EDB;
  --shadow: 0 1px 2px rgba(20, 36, 59, 0.05), 0 10px 28px -16px rgba(20, 36, 59, 0.22);
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --pixel: "Silkscreen", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--navy); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--forest); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 252px 1fr; min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; background: var(--card); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 22px 16px 18px; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; text-decoration: none; color: var(--burgundy); }
.brand canvas { width: 40px; height: 40px; }
.brand b { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; display: block; line-height: 1; }
.brand small { font-family: var(--pixel); font-size: 0.68rem; color: var(--forest); }
.nav { display: grid; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 12px; border: 0; background: none; text-align: left; padding: 11px 12px; border-radius: 12px; font-weight: 600; color: var(--muted); position: relative; }
.nav button svg { width: 20px; height: 20px; flex: none; }
.nav button:hover { background: var(--bg); color: var(--navy); }
.nav button[aria-current="page"] { background: var(--burgundy-soft); color: var(--burgundy); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; left: -16px; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--burgundy); }
.side-foot { margin-top: auto; display: grid; gap: 12px; }
.identity { font-size: 0.8rem; color: var(--muted); background: var(--bg); border-radius: 12px; padding: 12px; }
.sim-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 700; color: #8A5A00; background: var(--yellow-soft); border-radius: 999px; padding: 4px 10px; }
.sim-pill svg { width: 14px; height: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 700; transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease; }
.btn svg { width: 18px; height: 18px; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--burgundy); color: #fff; }
.btn.primary:hover { background: #561220; }
.btn.water { background: var(--forest); color: #fff; box-shadow: 0 6px 16px -8px rgba(19, 138, 99, 0.7); }
.btn.water:hover { background: #0F7553; }
.btn.ghost { background: var(--card); color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.ghost:hover { box-shadow: inset 0 0 0 1.5px var(--muted); }
.btn.small { padding: 7px 12px; font-size: 0.85rem; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: default; }

.main { min-width: 0; padding: 26px 32px 48px; }
.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.topbar h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; }
.topbar p { color: var(--muted); margin-top: 4px; }
.profile { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; padding: 8px 14px 8px 8px; box-shadow: var(--shadow); flex: none; }
.avatar { width: 40px; height: 40px; border-radius: 12px; background: var(--burgundy); color: #fff; display: grid; place-items: center; font-weight: 800; }
.profile .who b { display: block; font-size: 0.9rem; }
.profile .who span { font-size: 0.78rem; color: var(--muted); }
.profile .chips { display: flex; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--bg); white-space: nowrap; }
.chip svg { width: 14px; height: 14px; }
.chip.xp { background: var(--green-soft); color: var(--forest); }
.chip.fire { background: var(--yellow-soft); color: #9A5B00; }
.chip.lv { background: var(--burgundy-soft); color: var(--burgundy); }

.mobile-top, .bottom-nav { display: none; }

/* ---------- cards ---------- */
.card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 20px; }
.card h3 { font-size: 1.02rem; font-weight: 800; }
.card .sub { color: var(--muted); font-size: 0.86rem; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.grid { display: grid; gap: 18px; }
.home-grid { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
.stack { display: grid; gap: 18px; align-content: start; }

/* ---------- pet screen ---------- */
.pet-card { border-radius: 28px; padding: 22px; display: grid; gap: 16px; background: var(--card); box-shadow: var(--shadow); }
.pet-screen { position: relative; border-radius: 22px; padding: 18px; min-height: 300px; display: grid; place-items: center; overflow: hidden; transition: background 0.4s ease; background-color: var(--green-soft); background-image: linear-gradient(rgba(19, 138, 99, 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(19, 138, 99, 0.06) 1px, transparent 1px); background-size: 16px 16px; }
.pet-screen[data-tone="warn"] { background-color: var(--yellow-soft); background-image: linear-gradient(rgba(245, 166, 35, 0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(245, 166, 35, 0.09) 1px, transparent 1px); }
.pet-screen[data-tone="alert"] { background-color: var(--burgundy-soft); background-image: linear-gradient(rgba(107, 23, 40, 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(107, 23, 40, 0.06) 1px, transparent 1px); }
.pet-screen[data-tone="sleep"] { background-color: #E3E8F0; }
.pet-screen canvas { width: min(280px, 70vw); max-width: 100%; height: auto; aspect-ratio: 1; }
.pet-screen .stage-tag { position: absolute; top: 14px; left: 14px; font-family: var(--pixel); font-size: 0.72rem; background: rgba(255, 255, 255, 0.85); padding: 4px 10px; border-radius: 8px; color: var(--navy); }
.pet-screen .mood-tag { position: absolute; top: 14px; right: 14px; }
.mood { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 0.82rem; padding: 5px 11px; border-radius: 999px; }
.mood i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.mood.good { background: var(--green); color: #fff; }
.mood.warn { background: var(--yellow); color: #3D2600; }
.mood.alert { background: var(--burgundy); color: #fff; }
.mood.sleep { background: var(--navy); color: #fff; }
.bubble { position: relative; background: var(--card); border-radius: 16px; padding: 12px 16px; font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--line); }
.bubble::before { content: ""; position: absolute; top: -8px; left: 32px; width: 14px; height: 14px; background: var(--card); border-left: 1.5px solid var(--line); border-top: 1.5px solid var(--line); transform: rotate(45deg); }
.bubble b { color: var(--burgundy); }
.pet-meta { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between; }
.pet-meta .name { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
.pet-meta .name small { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.health { min-width: 200px; flex: 1; max-width: 300px; }
.health-row { display: flex; justify-content: space-between; font-size: 0.82rem; font-weight: 700; margin-bottom: 6px; }
.bar { height: 10px; border-radius: 10px; background: var(--grey); overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; border-radius: 10px; transition: width 0.5s ease, background 0.3s; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- stats ---------- */
.welcome h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
.welcome p { color: var(--muted); margin-top: 6px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.tile { background: var(--bg); border-radius: 14px; padding: 12px; }
.tile small { display: block; font-size: 0.75rem; color: var(--muted); font-weight: 600; }
.tile b { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile span { display: block; font-size: 0.75rem; color: var(--muted); }
.mini-readings { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.mini { display: flex; align-items: center; gap: 10px; background: var(--bg); border-radius: 14px; padding: 10px 12px; }
.mini .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.mini .ic svg { width: 18px; height: 18px; }
.mini small { display: block; font-size: 0.74rem; color: var(--muted); font-weight: 600; }
.mini b { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.tone-good { background: var(--green-soft); color: var(--forest); }
.tone-warn { background: var(--yellow-soft); color: #9A5B00; }
.tone-alert { background: var(--burgundy-soft); color: var(--burgundy); }
.tone-info { background: #E6F1FA; color: #1F6FA3; }
.score-ring { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
.ring { width: 72px; height: 72px; flex: none; }
.ring-label b { font-size: 1.1rem; display: block; }

.list { display: grid; gap: 12px; }
.mrow { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; }
.mrow .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; }
.mrow .ic svg { width: 18px; height: 18px; }
.mrow b { font-size: 0.92rem; display: block; margin-bottom: 4px; }
.mrow .bar { height: 7px; }
.mrow .xp-tag { font-size: 0.78rem; font-weight: 800; color: var(--forest); white-space: nowrap; }
.done-tag { font-size: 0.78rem; font-weight: 800; color: #fff; background: var(--green); padding: 3px 9px; border-radius: 999px; }

/* demo guide */
.guide { background: var(--navy); color: #E9EEF5; border-radius: 20px; padding: 16px 20px; margin-bottom: 18px; }
.guide-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.guide-head b { font-size: 0.95rem; }
.guide-head button { background: rgba(255, 255, 255, 0.1); border: 0; color: #fff; border-radius: 8px; padding: 5px 10px; font-size: 0.8rem; font-weight: 700; }
.guide ol { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.guide li { background: rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 10px; font-size: 0.8rem; display: grid; gap: 6px; align-content: start; }
.guide li .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.75rem; background: rgba(255, 255, 255, 0.14); }
.guide li.ok .n { background: var(--green); }
.guide li.ok { color: #BFE8D3; }
@media (max-width: 1100px) { .guide ol { grid-template-columns: repeat(3, 1fr); } }

/* ---------- monitor ---------- */
.banner { display: flex; gap: 12px; align-items: flex-start; background: var(--yellow-soft); border-radius: 16px; padding: 12px 16px; color: #6B4200; margin-bottom: 18px; font-size: 0.9rem; }
.banner svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.banner b { color: #4A2E00; }
.sensors { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.sensor { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 10px; align-content: start; border-top: 4px solid var(--green); }
.sensor.warn { border-top-color: var(--yellow); }
.sensor.alert { border-top-color: var(--burgundy); }
.sensor.info { border-top-color: var(--water); }
.sensor-top { display: flex; justify-content: space-between; align-items: center; }
.sensor-top .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
.sensor-top .ic svg { width: 18px; height: 18px; }
.sensor .label { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
.sensor .val { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.sensor .val small { font-size: 0.95rem; font-weight: 700; color: var(--muted); }
.status { font-size: 0.75rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
.track { position: relative; height: 10px; border-radius: 10px; background: var(--grey); }
.track > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 10px; transition: width 0.4s ease, background 0.3s; }
.track .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--navy); opacity: 0.45; border-radius: 2px; }
.scale { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.monitor-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; }
.care-card { display: grid; gap: 14px; }
.care-top { display: flex; gap: 16px; align-items: center; }
.care-top canvas { width: 112px; height: 112px; border-radius: 18px; flex: none; }
.ask { background: var(--bg); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.ask b { font-size: 0.92rem; }
.ask .row { display: flex; gap: 8px; flex-wrap: wrap; }
.feedback { font-size: 0.88rem; font-weight: 600; border-radius: 12px; padding: 10px 12px; }
.feedback:empty { display: none; }
.chart > svg { width: 100%; height: auto; display: block; }
.controls { margin-top: 18px; border-radius: 20px; border: 2px dashed #C9D3DE; background: repeating-linear-gradient(-45deg, #FBFCFD, #FBFCFD 10px, #F4F6F9 10px, #F4F6F9 20px); padding: 20px; }
.controls-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.controls-head h3 { display: flex; align-items: center; gap: 8px; font-size: 1rem; }
.controls-head h3 svg { width: 18px; height: 18px; }
.controls-head p { font-size: 0.84rem; color: var(--muted); margin-top: 2px; }
.sliders { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.slider label { display: flex; justify-content: space-between; font-size: 0.84rem; font-weight: 700; margin-bottom: 6px; }
.slider output { font-variant-numeric: tabular-nums; color: var(--burgundy); }
input[type="range"] { width: 100%; accent-color: var(--burgundy); }
select { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; width: 100%; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
.presets span { font-size: 0.8rem; font-weight: 700; color: var(--muted); margin-right: 4px; }

/* ---------- pet page ---------- */
.pet-page { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.pet-page .pet-screen { min-height: 380px; }
.pet-page .pet-screen canvas { width: min(340px, 100%); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fact { background: var(--bg); border-radius: 14px; padding: 12px; }
.fact small { display: block; font-size: 0.74rem; font-weight: 700; color: var(--muted); }
.fact b { font-size: 1rem; }
.name-edit { display: flex; gap: 8px; }
.name-edit input { flex: 1; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.moods { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.moodcell { border-radius: 16px; padding: 10px; background: var(--bg); display: grid; justify-items: center; gap: 4px; text-align: center; border: 2px solid transparent; }
.moodcell canvas { width: 72px; height: 72px; }
.moodcell b { font-size: 0.85rem; }
.moodcell span { font-size: 0.72rem; color: var(--muted); }
.moodcell.on { border-color: var(--burgundy); background: var(--burgundy-soft); }

/* ---------- learn ---------- */
.topics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.topic { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 12px; align-content: start; transition: transform 0.15s ease; border: 0; text-align: left; }
.topic:hover { transform: translateY(-2px); }
.topic .ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; }
.topic .ic svg { width: 26px; height: 26px; }
.topic h3 { font-size: 1.12rem; }
.topic p { color: var(--muted); font-size: 0.88rem; }
.topic ul { margin: 0; padding-left: 18px; font-size: 0.84rem; color: var(--muted); }
.topic .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 0.82rem; font-weight: 700; }
.lesson { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.lesson .card p + p { margin-top: 10px; }
.keys { display: grid; gap: 10px; margin-top: 14px; }
.key { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 0.92rem; }
.key .dot { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 0.8rem; }
.dims { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.dim { border: 0; text-align: left; border-radius: 16px; padding: 14px; background: var(--bg); display: grid; gap: 6px; min-height: 108px; align-content: start; box-shadow: inset 0 0 0 1.5px var(--line); }
.dim b { font-size: 0.95rem; }
.dim span { font-size: 0.82rem; color: var(--muted); }
.dim.open { background: var(--burgundy-soft); box-shadow: inset 0 0 0 1.5px rgba(107, 23, 40, 0.25); }
.fact-box { background: var(--green-soft); border-radius: 14px; padding: 12px 14px; font-size: 0.86rem; margin-top: 14px; }
.backlink { border: 0; background: none; color: var(--muted); font-weight: 700; display: inline-flex; gap: 6px; align-items: center; padding: 0; margin-bottom: 14px; }
.backlink svg { width: 16px; height: 16px; }
.quiz { max-width: 760px; }
.quiz-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 0.86rem; font-weight: 700; color: var(--muted); }
.quiz-progress { height: 12px; border-radius: 12px; background: var(--grey); overflow: hidden; margin-bottom: 20px; }
.quiz-progress i { display: block; height: 100%; background: var(--green); border-radius: 12px; transition: width 0.4s ease; }
.question { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 18px; }
.options { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; text-align: left; border: 0; background: var(--card); border-radius: 16px; padding: 14px 16px; box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 var(--line); font-weight: 600; transition: box-shadow 0.15s ease, background 0.15s ease; }
.opt:hover:not(:disabled) { box-shadow: inset 0 0 0 2px var(--forest), 0 3px 0 var(--forest); }
.opt .k { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--bg); font-weight: 800; }
.opt.right { background: var(--green-soft); box-shadow: inset 0 0 0 2px var(--green), 0 3px 0 var(--green); }
.opt.right .k { background: var(--green); color: #fff; }
.opt.wrong { background: var(--burgundy-soft); box-shadow: inset 0 0 0 2px var(--burgundy), 0 3px 0 var(--burgundy); }
.opt.wrong .k { background: var(--burgundy); color: #fff; }
.opt:disabled { cursor: default; }
.explain { margin-top: 16px; border-radius: 16px; padding: 14px 16px; display: grid; gap: 4px; }
.explain b { font-size: 1rem; }
.quiz-next { margin-top: 16px; display: flex; justify-content: flex-end; }
.result { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 28px; }
.result canvas { width: 140px; height: 140px; }
.result .big { font-size: 3rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }

/* ---------- missions ---------- */
.missions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.mission { display: grid; gap: 14px; align-content: start; }
.mission.done { box-shadow: var(--shadow), inset 0 0 0 2px var(--green); }
.mission-top { display: grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items: center; }

  s.battery = Math.max(0, Math.min(100, s.battery + ({ sunny: 6, cloudy: 2, night: -4 }[s.solar])));
  pushReading(); identifyAnswer = null;
  toast(`3 hours later: soil moisture ${s.moisture}%.`);
  save(); refresh(); syncControls();
}

function chart() {
  const h = S.history, W = 520, H = 170, pl = 34, pr = 10, pt = 12, pb = 26;
  const X = i => pl + (i / (h.length - 1)) * (W - pl - pr), Y = v => pt + (1 - v / 100) * (H - pt - pb);
  const pts = h.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const area = `M${X(0)},${Y(0)} ` + h.map((v, i) => `L${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ') + ` L${X(h.length - 1)},${Y(0)} Z`;
  const last = h[h.length - 1], lt = last < RULES.dry ? 'var(--yellow)' : last > RULES.wet ? 'var(--burgundy)' : 'var(--green)';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Simulated soil moisture over the last ${h.length} readings, latest ${last}%">
    <rect x="${pl}" y="${Y(RULES.wet)}" width="${W - pl - pr}" height="${Y(RULES.dry) - Y(RULES.wet)}" fill="rgba(34,160,107,0.10)"/>
    ${[0, 40, 85, 100].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`).join('')}
    <text x="${W - pr - 4}" y="${Y(RULES.wet) + 14}" text-anchor="end" font-size="11" fill="var(--forest)" font-weight="700">Normal range</text>
    <path d="${area}" fill="rgba(19,138,99,0.08)"/>
    <polyline points="${pts}" fill="none" stroke="var(--forest)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(h.length - 1)}" cy="${Y(last)}" r="5.5" fill="${lt}" stroke="#fff" stroke-width="2"/>
    <text x="${pl}" y="${H - 6}" font-size="11" fill="var(--muted)">Older</text><text x="${W - pr}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--muted)">Latest reading</text>
  </svg>`;
}

    <section class="card"><h2 class="question">${q.q}</h2>
      <div class="options">${q.o.map((o, i) => {
        let cls = ''; if (answered) { if (i === q.a) cls = 'right'; else if (i === quiz.picked) cls = 'wrong'; }
        return `<button class="opt ${cls}" type="button" data-opt="${i}" ${answered ? 'disabled' : ''}><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`;
      }).join('')}</div>
      ${answered ? `<div class="explain ${quiz.picked === q.a ? 'tone-good' : 'tone-alert'}" aria-live="polite"><b>${quiz.picked === q.a ? (quiz.gained ? 'Correct! +10 XP' : 'Correct!') : 'Not quite.'}</b><span>${q.e}</span></div>
        <div class="quiz-next"><button class="btn primary" type="button" data-action="next-q">${quiz.i + 1 < qs.length ? 'Next question' : 'See results'}</button></div>` : ''}
    </section></div>`;
}
function pickOption(i) {
  const k = quiz.topic, q = QUESTIONS[k][quiz.i], id = `${k}-${quiz.i}`;
  quiz.picked = i; quiz.gained = false;
  S.demo.quiz = true;
  if (i === q.a) {
    quiz.score++;
    if (!S.correct[id]) { S.correct[id] = true; quiz.xp += 10; quiz.gained = true; addXP(10, 'Correct quiz answer'); }
  }
  save(); refresh();
}
function nextQuestion() {
  quiz.i++; quiz.picked = null;
  if (quiz.i >= QUESTIONS[quiz.topic].length) {
    const k = quiz.topic, total = QUESTIONS[k].length, best = S.quizBest[k];
    if (!best || quiz.score > best.score) S.quizBest[k] = { score: quiz.score, total };
    log(`Finished quiz: ${TOPICS[k].title} (${quiz.score}/${total})`);
    step({ t1: 'fsQuiz', t2: 'spQuiz', t3: 'rcQuiz' }[k]);
  }
  save(); refresh();
}

function renderMissions() {
  return `<div class="missions">${MISSIONS.map(m => {
    const done = m.steps.filter(s => S.steps[s.k]).length, all = m.steps.length, fin = !!S.missionsDone[m.id];
    const activity = m.id === 'champion' ? renderActivity() : '';
    return `<section class="card mission ${fin ? 'done' : ''}">
      <div class="mission-top"><span class="ic ${m.tone}">${icon(m.icon)}</span><div><h3>${m.title}</h3><p class="sub">${m.desc}</p></div>${fin ? '<span class="done-tag">Completed</span>' : `<span class="chip xp">+${m.xp} XP</span>`}</div>
      <div><div class="health-row"><span>${done} of ${all} steps</span><span>${Math.round((done / all) * 100)}%</span></div><div class="bar"><i style="width:${(done / all) * 100}%;background:var(--green)"></i></div></div>
      <ul class="steps">${m.steps.map(s => `<li class="${S.steps[s.k] ? 'ok' : ''}"><span class="tick">${S.steps[s.k] ? icon('check') : ''}</span><span>${s.label}</span>${S.steps[s.k] || s.go === 'activity' ? '' : `<button class="btn ghost small" type="button" data-step-go="${s.go}">Go</button>`}</li>`).join('')}</ul>
      ${activity}
    </section>`;
  }).join('')}</div>`;
}
function renderActivity() {
  if (S.steps.waterActivity) return `<div class="activity tone-good"><b>Water conservation activity complete.</b><span class="sub">You picked all three water-smart habits.</span></div>`;
  return `<div class="activity" id="activity"><b>Activity: pick the three water-smart habits</b>
    <div class="habits">${HABITS.map(([h], i) => `<button class="habit" type="button" data-habit="${i}" aria-pressed="${S.habitsPicked.includes(i)}">${h}</button>`).join('')}</div>
    <div class="actions"><button class="btn primary small" type="button" data-action="check-habits" ${S.habitsPicked.length !== 3 ? 'disabled' : ''}>Check my answer</button><span class="sub" id="habitMsg">${S.habitsPicked.length}/3 selected</span></div></div>`;
}

function renderProgress() {
  const lv = levelOf(S.xp), cur = LEVELS[lv - 1], next = LEVELS[lv];
  const pct = next !== undefined ? ((S.xp - cur) / (next - cur)) * 100 : 100;
  const doneM = MISSIONS.filter(m => S.missionsDone[m.id]);
  return `<div class="grid">
    <section class="card level-card"><div class="level-badge"><div><small>LEVEL</small><b>${lv}</b></div></div>
      <div><h3>${STAGES[lv - 1]}</h3><div class="xpbar"><i style="width:${pct}%"></i></div><p class="sub">${next !== undefined ? `${S.xp} XP earned. ${next - S.xp} XP needed for level ${lv + 1}, ${STAGES[lv]}.` : `${S.xp} XP earned. ${esc(S.petName)} is fully grown.`} XP comes from correct answers, careful watering, check-ins and missions.</p></div></section>
    <section class="card"><div class="card-head"><h3>Growth path</h3><span class="sub">Each stage unlocks at a new level</span></div>
      <div class="path">${STAGES.map((n, i) => `<div class="stagebox ${i + 1 === lv ? 'current' : i + 1 > lv ? 'locked' : ''}">${petCanvas(96, i + 1, 'happy', n)}<b>${n}</b><span>${i + 1 > lv ? `${icon('lock')} Level ${i + 1}, ${LEVELS[i]} XP` : `Level ${i + 1}`}</span></div>`).join('')}</div></section>
    <section class="card"><div class="card-head"><h3>Badges and rewards</h3><span class="sub">${BADGES.filter(b => b.test(S)).length} of ${BADGES.length} unlocked</span></div>
      <div class="badges">${BADGES.map(b => { const on = b.test(S); return `<div class="badge ${on ? '' : 'locked'}"><span class="ic ${on ? b.tone : ''}">${icon(on ? b.icon : 'lock')}</span><b>${b.title}</b><span>${b.desc}</span></div>`; }).join('')}</div></section>
    <div class="two">
      <section class="card"><div class="card-head"><h3>Quiz scores</h3></div><div class="list">${topicProgress()}</div>
        <h3 style="margin:18px 0 10px">Completed missions</h3>${doneM.length ? `<div class="list">${doneM.map(m => `<div class="mrow"><span class="ic ${m.tone}">${icon(m.icon)}</span><div><b>${m.title}</b></div><span class="xp-tag">+${m.xp} XP</span></div>`).join('')}</div>` : '<p class="sub">No missions completed yet. Start with Daily Plant Care.</p>'}</section>
      <section class="card"><div class="card-head"><h3>Activity log</h3><button class="btn ghost small" type="button" data-action="reset">Reset demo</button></div>
        <ul class="log">${S.log.slice(0, 10).map(l => `<li><span>${esc(l.t)}</span>${l.xp ? `<b>+${l.xp} XP</b>` : ''}</li>`).join('')}</ul></section>
    </div>
  </div>`;
}

/* ================= router ================= */
const RENDER = { home: renderHome, pet: renderPet, monitor: renderMonitor, learn: renderLearn, missions: renderMissions, progress: renderProgress };
function render() {
  nav(); header();
  document.getElementById('view').innerHTML = RENDER[view]();
  animate();
}
function refresh() {
  if (view === 'monitor' && document.getElementById('monitorLive')) {
    nav(); header();
    document.getElementById('monitorLive').innerHTML = renderMonitorLive();
    animate();
  } else render();
}
function go(v, silent) {
  if (!RENDER[v]) v = 'home';
  view = v;
  if (v === 'monitor' || v === 'pet') step('checked');
  if (v === 'monitor') S.demo.monitor = true;
  if (v === 'home' && S.demo.mission) S.demo.back = true;
  if (v !== 'learn') { learn = null; quiz = null; }
  careMsg = v === 'monitor' ? careMsg : null;
  save();
  if (location.hash.slice(1) !== v) { try { history.replaceState(null, '', '#' + v); } catch (e) { location.hash = v; } }
  render();
  if (!silent) window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
}
function stepGo(target) {
  const [kind, arg] = target.split(':');
  if (kind === 'lesson') { go('learn'); learn = { topic: arg, mode: 'lesson' }; render(); }
  else if (kind === 'quiz') { go('learn'); startQuiz(arg); }
  else go(kind);
}
function startQuiz(k) { learn = { topic: k, mode: 'quiz' }; quiz = { topic: k, i: 0, picked: null, score: 0, xp: 0 }; render(); }

/* ================= events ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a');
  if (!t) return;
  if (t.matches('a.brand')) { e.preventDefault(); go('home'); return; }
  const d = t.dataset;
  if (d.go) { go(d.go); return; }
  if (d.stepGo) { stepGo(d.stepGo); return; }
  if (d.lesson) { learn = { topic: d.lesson, mode: 'lesson' }; quiz = null; render(); return; }
  if (d.quiz) { startQuiz(d.quiz); return; }
  if (d.opt !== undefined) { pickOption(Number(d.opt)); return; }
  if (d.preset) { applyPreset(d.preset); return; }
  if (d.dim !== undefined) {
    const i = Number(d.dim);
    if (!S.dimsSeen.includes(i)) S.dimsSeen.push(i);
    if (S.dimsSeen.length === 4 && !S.steps.fourDims) { log('Learned the four dimensions of food security'); toast('You learned all four dimensions!'); step('fourDims'); }
    save(); render(); return;
  }
  if (d.habit !== undefined) {
    const i = Number(d.habit), p = S.habitsPicked;
    if (p.includes(i)) p.splice(p.indexOf(i), 1); else if (p.length < 3) p.push(i);
    save(); render(); return;
  }
  switch (d.action) {
    case 'water': water(); break;
    case 'checkin': checkIn(); break;
    case 'tip': toast(TIPS[moodNow()]); break;
    case 'id-yes': answerIdentify(true); break;
    case 'id-no': answerIdentify(false); break;
    case 'ff': fastForward(); break;
    case 'topics': learn = null; quiz = null; render(); break;
    case 'next-q': nextQuestion(); break;
    case 'toggle-guide': S.guideOpen = !S.guideOpen; save(); render(); break;
    case 'reset': askReset(); break;
    case 'confirm-reset': doReset(); break;
    case 'close-modal': closeModal(); refresh(); break;
    case 'check-habits': {
      const ok = S.habitsPicked.every(i => HABITS[i][1]) && S.habitsPicked.length === 3;
      if (ok) { log('Completed the water conservation activity'); toast('All three habits are water-smart!'); step('waterActivity'); save(); render(); }
      else {
        document.querySelectorAll('[data-habit]').forEach(b => { const i = Number(b.dataset.habit); if (S.habitsPicked.includes(i) && !HABITS[i][1]) b.classList.add('bad'); });
        const m = document.getElementById('habitMsg'); if (m) m.textContent = 'One or more choices waste water. Swap the red ones and try again.';
      }
      break;
    }
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('input[type="range"][data-sensor]')) {
    const k = el.dataset.sensor, v = Number(el.value);
    document.getElementById('out-' + k).textContent = v + el.dataset.unit;
    S.sensors[k] = v; identifyAnswer = null; careMsg = null;
    save(); refresh();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('input[type="range"][data-sensor="moisture"]')) { pushReading(); save(); refresh(); }
  if (el.matches('select[data-sensor]')) applySensor(el.dataset.sensor, el.value, false);
});
document.addEventListener('submit', e => {
  if (e.target.matches('[data-form="name"]')) {
    e.preventDefault();
    const v = document.getElementById('petName').value.trim().slice(0, 16);
    if (v) { S.petName = v; save(); render(); toast(`Your pet is now called ${v}.`); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('overlay').hidden) { closeModal(); refresh(); } });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== view && RENDER[v]) go(v); });

const startView = location.hash.slice(1);
go(RENDER[startView] ? startView : 'home', true);
setInterval(animate, 500);
})();
</script>
</body>
</html>
